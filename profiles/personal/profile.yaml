kind: bootstrap-profile
contract_version: 0.1.0
status: active
profile:
  id: personal
  owner_repo: javi-dots
  milestone: javi-dots-completion
  purpose: personal machine setup — base + AI with shared packages + optional forge
  recommended_for:
    - personal development machines
    - full SDD workflow with memory, skills, and hooks
    - developers who use javi-forge for project scaffolding
  install_entrypoint: scripts/javi.sh
  preset_equivalent: full
  required_inputs:
    - ai-choice: one published AI provider choice ID
  optional_inputs:
    - template-choice: forge template for a new project
    - generator-choice: forge generator to run
    - project-name: project name for forge output
module_refs:
  - modules/bootstrap/module.yaml
  - modules/shell/fish/module.yaml
  - modules/terminal/ghostty/module.yaml
  - modules/editor/zed/module.yaml
optional_modules:
  - modules/terminal/wezterm/module.yaml
  - modules/multiplexer/tmux/module.yaml
  - modules/multiplexer/zellij/module.yaml
  - modules/prompt/starship/module.yaml
  - modules/shell/zsh/module.yaml
optional_consumer_modules:
  - modules/ai/module.yaml
  - modules/forge/module.yaml
composition_rules:
  - personal profile composes base + ai-full (shared packages + provider) + optional forge
  - use with: scripts/javi.sh --profile personal --ai-choice ai.claude.user --home "$HOME"
  - shared AI packages (skills, hooks, instructions) are installed in this profile
