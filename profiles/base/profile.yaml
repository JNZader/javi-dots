kind: bootstrap-profile
contract_version: 0.1.0
status: scaffold
profile:
  id: base
  owner_repo: javi-dots
  purpose: minimal workstation composition for the first bootstrap extraction slice
module_refs:
  - modules/bootstrap/module.yaml
  - modules/shell/fish/module.yaml
  - modules/terminal/ghostty/module.yaml
  - modules/editor/zed/module.yaml
optional_consumer_modules:
  - modules/ai/module.yaml
  - modules/forge/module.yaml
composition_rules:
  - base profile composes local bootstrap modules first
  - AI and forge remain optional consumer-side integrations
  - sibling repos are consumed by contracts only
