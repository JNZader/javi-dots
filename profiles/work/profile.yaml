kind: bootstrap-profile
contract_version: 0.1.0
status: active
profile:
  id: work
  owner_repo: javi-dots
  milestone: javi-dots-completion
  purpose: work machine setup — base + one AI provider profile
  recommended_for:
    - work laptops and managed machines
    - single-provider AI coding assistant setup
    - teams standardizing on one AI tool
  install_entrypoint: scripts/javi.sh
  preset_equivalent: ai-core
  required_inputs:
    - ai-choice: one published AI provider choice ID
module_refs:
  - modules/bootstrap/module.yaml
  - modules/shell/fish/module.yaml
  - modules/terminal/ghostty/module.yaml
  - modules/editor/zed/module.yaml
optional_modules:
  - modules/multiplexer/tmux/module.yaml
  - modules/multiplexer/zellij/module.yaml
  - modules/prompt/starship/module.yaml
optional_consumer_modules:
  - modules/ai/module.yaml
composition_rules:
  - work profile composes base modules + one AI provider choice
  - use with: scripts/javi.sh --profile work --ai-choice ai.claude.user --home "$HOME"
  - AI choice is required; run: scripts/bootstrap/apply-ai.sh --list-choices
