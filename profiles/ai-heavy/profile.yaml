kind: bootstrap-profile
contract_version: 0.1.0
status: active
profile:
  id: ai-heavy
  owner_repo: javi-dots
  milestone: javi-dots-completion
  purpose: ai-heavy machine — base + shared AI packages + all six provider profiles
  recommended_for:
    - AI research and experimentation machines
    - developers testing multiple AI CLI providers
    - power users who want all providers available simultaneously
  install_entrypoint: scripts/javi.sh
  preset_equivalent: ai-core (repeated for each provider)
  ai_choices_installed:
    - ai.claude.user
    - ai.opencode.user
    - ai.gemini.user
    - ai.qwen.user
    - ai.codex.user
    - ai.copilot.repo
module_refs:
  - modules/bootstrap/module.yaml
  - modules/shell/fish/module.yaml
  - modules/terminal/ghostty/module.yaml
  - modules/editor/zed/module.yaml
optional_modules:
  - modules/terminal/wezterm/module.yaml
  - modules/multiplexer/tmux/module.yaml
  - modules/prompt/starship/module.yaml
optional_consumer_modules:
  - modules/ai/module.yaml
composition_rules:
  - ai-heavy profile installs base + shared AI packages + all six provider profiles
  - use with: scripts/javi.sh --profile ai-heavy --home "$HOME"
  - no ai-choice required; all six providers are installed
  - shared packages (skills, hooks, instructions) are installed once
  - copilot installs as repo-scoped; requires --destination for a specific repo
notes:
  - install time is higher than other profiles because all six providers are installed
  - each provider installs into its own config directory without conflicts
