kind: bootstrap-profile
contract_version: 0.1.0
status: active
profile:
  id: minimal
  owner_repo: javi-dots
  milestone: javi-dots-completion
  purpose: minimal workstation setup — base tools only, no AI or forge
  recommended_for:
    - servers and VMs where AI tools are not needed
    - environments where you want only shell, terminal, and editor
    - a fast baseline before layering additional presets
  install_entrypoint: scripts/javi.sh
  preset_equivalent: base
module_refs:
  - modules/bootstrap/module.yaml
  - modules/shell/fish/module.yaml
  - modules/terminal/ghostty/module.yaml
  - modules/editor/zed/module.yaml
optional_modules:
  - modules/shell/zsh/module.yaml
  - modules/prompt/starship/module.yaml
optional_consumer_modules: []
composition_rules:
  - minimal profile composes only the base workstation modules
  - no AI or forge consumer integration
  - use with: scripts/javi.sh --profile minimal --home "$HOME"
