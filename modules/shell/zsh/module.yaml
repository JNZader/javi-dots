kind: workstation-module
contract_version: 0.1.0
status: extracted-slice
module:
  id: shell.zsh
  owner_repo: javi-dots
  slot: shell
  milestone: javi-dots-completion
  purpose: Zsh shell configuration with Oh-My-Zsh and Powerlevel10k prompt
  install_entrypoint: scripts/bootstrap/apply.sh
assets:
  - source: modules/shell/zsh/config/.zshrc
    destination: ~/.zshrc
    delivery: link
    role: zsh main configuration
  - source: modules/shell/zsh/config/.p10k.zsh
    destination: ~/.p10k.zsh
    delivery: link
    role: powerlevel10k theme configuration
dependencies:
  - oh-my-zsh (must be installed separately: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)")
  - powerlevel10k (installed via oh-my-zsh or brew)
lineage:
  reference_source: vault/Javi.Dots/GentlemanZsh/
  source_type: curated-delta
  maintenance_owner: javi-dots
  active_legacy_dependency: none
rules:
  - zsh config is extracted for reference; users must install oh-my-zsh and p10k separately
  - the extracted .zshrc is opinionated for the Gentleman.Dots workflow
notes:
  - javi-dots-completion extracts the first zsh module slice.
  - Includes Powerlevel10k instant prompt, nvm, homebrew, and modern tool aliases.
