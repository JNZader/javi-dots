kind: bootstrap-module-group
contract_version: 0.1.0
status: extracted-slice
group:
  id: bootstrap.core
  owner_repo: javi-dots
  purpose: host the first extracted workstation/bootstrap slices behind the javi-dots boundary
structure_rules:
  - bootstrap modules stay canonical in javi-dots
  - AI integration uses only modules/ai/module.yaml and javi-ai public contracts
  - forge exposure uses only modules/forge/module.yaml and javi-forge public contracts
  - no module in this group may read javi-ai internal packages or provider directories
module_slots:
  - slot_id: installer.cli
    readiness: extracted-slice
    entrypoint: scripts/bootstrap/apply.sh
    extracted_assets:
      - scripts/bootstrap/apply.sh
    lineage:
      preferred_base: Gentleman.Dots
      legacy_delta:
        - vault/Javi.Dots/installer/
  - slot_id: shell.fish
    readiness: extracted-slice
    module_manifest: modules/shell/fish/module.yaml
    extracted_assets:
      - modules/shell/fish/config/config.fish
      - modules/shell/fish/config/conf.d/nvm.fish
      - modules/shell/fish/config/fish_plugins
    lineage:
      preferred_base: Gentleman.Dots
      legacy_delta:
        - vault/Javi.Dots/GentlemanFish/
  - slot_id: terminal.ghostty
    readiness: extracted-slice
    module_manifest: modules/terminal/ghostty/module.yaml
    extracted_assets:
      - modules/terminal/ghostty/config/config
      - modules/terminal/ghostty/config/shaders/cursor_smear_gentleman.glsl
    lineage:
      preferred_base: Gentleman.Dots
      legacy_delta:
        - vault/Javi.Dots/GentlemanGhostty/
  - slot_id: editor.zed
    readiness: extracted-slice
    module_manifest: modules/editor/zed/module.yaml
    extracted_assets:
      - modules/editor/zed/config/settings.json
      - modules/editor/zed/config/keymap.json
    lineage:
      preferred_base: Gentleman.Dots
      legacy_delta:
        - vault/Javi.Dots/GentlemanZed/
consumer_contracts:
  ai:
    module_manifest: modules/ai/module.yaml
    bootstrap_entrypoint: scripts/bootstrap/apply-ai.sh
    install_entrypoint: ../javi-ai/scripts/install-profiles.sh
    install_rule:
      - bootstrap AI requests route through the local consumer wrapper first
      - use published provider, package, and target IDs only
      - do not consult legacy AI installer docs or fallback behavior for migrated flows
      - never infer runtime behavior from javi-ai internal layout
  forge:
    module_manifest: modules/forge/module.yaml
notes:
  - WI-014 extracts the first bounded bootstrap slice into the canonical slots above
  - the extracted installer remains local to javi-dots and does not consume javi-ai internals
  - WI-026 cuts bootstrap AI consumption over to the published javi-ai install surface
